<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

   
      
        
    <title>Site</title>

    <style>

        *{

            padding: 0px;
            font-family: 'Roboto',sans-serif;
        }

        main{
            width: 100vh;
        }

        .card{
            display: inline-block;
            width: 250px;
            padding: 7px;

            margin: 5px;
            
            
        }

        .card span{
            position: absolute;
            padding: 10px;
            color: grey;
        }

        .card img{
            width: 100%;
        }

        .card h3{
            font-size: 1em;
            color: rgb(74, 74, 75);
            text-align: center;
        }

        .card p{
            color: #3a3a3aea;
            text-align: center;
        }

        .card button{
            width: 100%;
            height: 30px;
            border: none;
            color: rgb(31, 30, 30);
            font-weight: 800;
            background-color: #F7C501;
        }

    </style>
</head>
