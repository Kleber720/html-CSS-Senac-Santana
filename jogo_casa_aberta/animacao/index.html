<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animação</title>
 
    <style>
        #card1{
            width: 300px;
            height: 300px;
            background-color: blue;
            transition: width 1s ease-in,background-color 1s ;
        }
 
        #card1:hover{
            width: 450px;
            background-color:blueviolet;
 
        }
 
        #card2{
            width: 300px;
            height: 300px;
            background-color: rgb(146, 36, 137);
            transition: border-radius 0.5s linear;
 
        }
 
        #card2:hover{
            border-radius: 50%;
 
        }

        #card3{
            height: 300px;
            width: 300px;
            display: flex;
            text-align: center;
            border: 1px solid black;
        }
    </style>
</head>
<body>
   
    <div id="card1">
 
    </div>
    <div id="card2">
 
 
    </div>

    <div id="card3">
        <img src="one-piece-trafalgar-law.avif" alt="">
        <h1>Titulo</h1>
    </div>
 
</body>
</html>
